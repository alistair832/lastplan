name: Benchmark Three Fruit Models

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark-three-models.yml'
      - 'experiments/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install kagglehub

      - name: Download public Kaggle dataset
        id: dataset
        run: |
          python - <<'PY'
          import os
          import kagglehub
          path = kagglehub.dataset_download('utkarshsaxenadn/fruits-classification')
          print(f'Dataset downloaded to: {path}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'path={path}\n')
          PY

      - name: Member 2 - Custom CNN
        run: |
          python experiments/member2_custom_cnn.py --data "${{ steps.dataset.outputs.path }}" --epochs 8

      - name: Member 3 - HOG and Linear SVM
        run: |
          python experiments/member3_hog_svm.py --data "${{ steps.dataset.outputs.path }}"

      - name: Build comparison files
        run: |
          python experiments/compare_results.py

      - name: Show comparison
        run: cat experiments/results/COMPARISON.md

      - name: Commit benchmark results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results
          if git diff --cached --quiet; then
            echo "No benchmark result changes to commit."
          else
            git commit -m "Add three-model benchmark results [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: three-model-comparison
          path: experiments/results
          retention-days: 30
